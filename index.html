<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal</title>
  <link rel="icon" href="https://i.ibb.co/zhrn5w6Q/Eye.png">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.7;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: 24px 28px;
      overflow: hidden;
    }

    /* ---- Header ---- */
    #header {
      border-bottom: 1px solid #fff;
      padding-bottom: 10px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      user-select: none;
      flex-shrink: 0;
    }

    #header span:first-child {
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #header span:last-child {
      font-size: 11px;
      opacity: 0.5;
    }

    /* ---- Output area ---- */
    #output {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 12px;
    }

    #output::-webkit-scrollbar {
      width: 3px;
    }

    #output::-webkit-scrollbar-track {
      background: transparent;
    }

    #output::-webkit-scrollbar-thumb {
      background: #444;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line.cmd {
      opacity: 0.5;
    }

    .line.response {
      opacity: 1;
    }

    .line.empty {
      height: 1.7em;
    }

    .line.error {
      opacity: 0.6;
    }

    /* ---- Input row ---- */
    #input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #fff;
      padding-top: 10px;
      flex-shrink: 0;
    }

    #prompt-symbol {
      user-select: none;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      caret-color: #fff;
    }

    #input:focus {
      caret-color: #fff;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* ---- Ícone de chat flutuante ---- */
    #chat-icon {
      position: fixed;
      right: clamp(12px, 3vw, 28px);
      bottom: clamp(12px, 3vw, 28px);
      width: clamp(44px, 9vw, 64px);
      height: clamp(44px, 9vw, 64px);
      border-radius: 50%;
      background: #fff;
      border: 1px solid #fff;
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      z-index: 1000;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    #chat-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #chat-bubble {
      position: fixed;
      right: clamp(12px, 3vw, 28px);
      bottom: calc(clamp(44px, 9vw, 64px) + clamp(12px, 3vw, 28px) + 10px);
      max-width: min(80vw, 260px);
      background: #000;
      border: 1px solid #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      z-index: 1000;
      display: none;
    }

    #chat-bubble.visible {
      display: block;
    }
  </style>
</head>

<body>

  <div id="header">
    <span>Terminal, bem-vinda de volta, Maria. Você ainda é a Maria?</span>
  </div>

  <div id="output"></div>

  <div id="input-row">
    <span id="prompt-symbol">&gt;</span>
    <input type="text" id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      autofocus />
  </div>

  <button id="chat-icon" type="button" aria-label="Abrir mensagem">
    <img src="https://i.ibb.co/zhrn5w6Q/Eye.png" alt="" />
  </button>
  <div id="chat-bubble"></div>

      function _decode(encoded, key) {

      const PROMPT_TEXT = ">";

      const outputEl = document.getElementById("output");
      const inputEl = document.getElementById("input");
      const clockEl = document.getElementById("clock");

      const cmdHistory = [];
      let historyIndex = -1;

      function printLine(text, type) {
        type = type || "response";
        const el = document.createElement("div");
        el.className = "line " + (text === "" ? "empty" : type);
        if (text !== "") el.textContent = text;
        outputEl.appendChild(el);
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      function printLines(lines, type) {
        lines.forEach(function (l) { printLine(l, type); });
      }

      function isInstagramEmbed(value) {
        return /instagram\.com\/(p|reel|reels|tv)\//i.test(value) ||
          /instagr\.am\/(p|reel|reels|tv)\//i.test(value) ||
          /instagram\.com\/embed\.js/i.test(value) ||
          /instagram-media/i.test(value);
      }

      function getInstagramEmbedUrl(value) {
        if (/\/embed(\/|\?|$)/i.test(value)) return value;
        const match = value.match(/https?:\/\/(?:www\.)?(?:instagram\.com|instagr\.am)\/(p|reel|reels|tv)\/([^/?#]+)/i);
        return match ? "https://www.instagram.com/" + match[1] + "/" + match[2] + "/embed" : value;
      }

      function printMedia(url) {
        const isVideo = /\.(mp4|webm|ogg)(\?|$)/i.test(url);
        const wrapper = document.createElement("div");
        wrapper.className = "line response";
        wrapper.style.margin = "6px 0";

        if (/^\s*<[^>]+>/.test(url)) {
          wrapper.innerHTML = url;
          wrapper.style.width = "100%";
          wrapper.style.maxWidth = "100%";
        } else if (isInstagramEmbed(url)) {
          const iframe = document.createElement("iframe");
          iframe.src = getInstagramEmbedUrl(url);
          iframe.title = "Instagram embed";
          iframe.loading = "lazy";
          iframe.allow = "clipboard-write; encrypted-media; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.style.width = "100%";
          iframe.style.maxWidth = "540px";
          iframe.style.minHeight = "520px";
          iframe.style.border = "0";
          iframe.style.display = "block";
          wrapper.appendChild(iframe);
        } else if (isVideo) {

      function handleCommand(raw) {

        printLine(PROMPT_TEXT + " " + cmd, "cmd");

        const lower = cmd.toLowerCase();

        if (lower === "clear") {
          outputEl.innerHTML = "";
          return;
        }

        const response = _keywordMap[lower];

        if (response !== undefined) {
          // Formato simples: array de strings
          if (Array.isArray(response)) {
            printLines(response, "response");
            // Formato com mídia: { text: "..." ou [...], media: "url" }

            } else if (Array.isArray(response.text)) {

            inputEl.value = cmdHistory[historyIndex];
          } else {

            inputEl.value = "";

      chatIcon.addEventListener("click", function (e) {

        chatBubble.classList.toggle("visible");
      });

    })();
  </script>
